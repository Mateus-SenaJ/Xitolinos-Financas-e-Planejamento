services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      MYSQL_DATABASE: xitolinos_financas
      MYSQL_USER: xitolinos
      MYSQL_PASSWORD: ${DATABASE_PASSWORD:?Crie um .env local a partir do backend/.env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Defina MYSQL_ROOT_PASSWORD no .env local}
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - xitolinos_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 12
volumes:
  xitolinos_mysql:
